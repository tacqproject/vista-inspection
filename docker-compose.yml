name: vista-raw-development

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend:/app
      - raw_data:/data
    environment:
      - ISOLATED_DATA_ROOT=/data
      - DATABASE_URL=sqlite+aiosqlite:////data/vista.db
      - UPLOAD_DIR=/data/uploads
      - WORK_DIR=/data/scratch
      - CORS_ORIGINS=http://localhost:5174
      - AUTO_RECONSTRUCT=false
      - JWT_SECRET=${JWT_SECRET:?Set a private RAW JWT_SECRET}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?Set a private RAW admin password}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VISTA_API_TARGET=http://backend:8001
    depends_on:
      - backend
    restart: unless-stopped

  # Volitelné: OpenDroneMap pro fotogrammetrii
  # odm:
  #   image: opendronemap/nodeodm
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - odm_data:/var/www/data

volumes:
  raw_data:
